name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: node --test test/plugin.test.cjs
      - run: python3 build.py
      - name: Check tag and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from zipfile import ZipFile
          m = json.loads(Path('manifest.json').read_text())
          if os.environ['IS_TAG'] == 'true':
              assert os.environ['RELEASE_TAG'] == 'v' + m['version']
          xpi = Path('dist') / ('conference-abbreviations-' + m['version'] + '.xpi')
          u = json.loads(Path('dist/updates.json').read_text())['addons'][m['applications']['zotero']['id']]['updates'][0]
          assert u['update_hash'] == 'sha256:' + hashlib.sha256(xpi.read_bytes()).hexdigest()
          with ZipFile(xpi) as z:
              assert z.testzip() is None
              assert json.loads(z.read('manifest.json')) == m
          PY
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.xpi dist/updates.json dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
